name: Bug report
description: Report an ATC Sim gameplay, display or performance problem.
title: "[Bug]: "
body:
  - type: input
    id: version
    attributes:
      label: Version and build
      placeholder: v1.1.6 / build 57
    validations:
      required: true
  - type: input
    id: airport
    attributes:
      label: Airport and position
      placeholder: RCTP / GND
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include traffic mode, weather, simulation speed and relevant aircraft/taxiway/runway identifiers.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
  - type: upload
    id: evidence
    attributes:
      label: Diagnostic ZIP or screenshots
      description: The in-app reporter attaches its diagnostic ZIP here automatically after sign-in. Review attachments before submitting.
    validations:
      required: false
      accept: ".zip,.png,.jpg,.jpeg,.webp"
